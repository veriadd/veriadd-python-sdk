[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriadd"
version = "0.1.0"
description = "Official Python client for the Veriadd address KYC API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["kyc", "fintech", "identity", "verification", "nigeria"]
authors = [{ name = "Veriadd" }]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://veriadd.tech"
Documentation = "https://veriadd.tech/docs"
Repository = "https://github.com/veriadd/veriadd-python-sdk"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/veriadd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
